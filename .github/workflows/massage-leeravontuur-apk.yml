name: Build Massage Leeravontuur APK
on:
  push:
    branches: [massage-leeravontuur-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: massage-apk
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp massage-apk/app/build/outputs/apk/debug/app-debug.apk massage-apk/app/build/outputs/apk/debug/Massage-Leeravontuur.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Massage-Leeravontuur-APK
          path: massage-apk/app/build/outputs/apk/debug/Massage-Leeravontuur.apk
          if-no-files-found: error
