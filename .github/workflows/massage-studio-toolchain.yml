name: Prepare Studio APK build tools
on:
  push:
    branches: [massage-leeravontuur-apk]
    paths: ['.github/workflows/massage-studio-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare local offline compiler bundle
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/35.0.0"
          test -f "$SDK/platforms/android-35/android.jar"
          test -f "$BT/lib/d8.jar"
          mkdir -p bundle/lib bundle/lib64
          cp "$SDK/platforms/android-35/android.jar" bundle/android.jar
          cp "$BT/aapt2" "$BT/zipalign" bundle/
          cp "$BT/lib/d8.jar" "$BT/lib/apksigner.jar" bundle/lib/
          cp "$BT/lib64/"*.so* bundle/lib64/ 2>/dev/null || true
          cp "$BT/NOTICE.txt" bundle/NOTICE.txt
          find bundle -type f -exec sha256sum {} \; > bundle/SHA256SUMS.txt
      - name: Downloadable offline tools
        uses: actions/upload-artifact@v4
        with:
          name: Studio-APK-offline-tools
          path: bundle/
          retention-days: 1
          if-no-files-found: error
