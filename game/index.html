<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#15151a" />
  <meta name="description" content="Swerve - a 3-lane endless obstacle dash with a daily seeded course for every player in the world." />
  <title>Swerve</title>
  <link rel="canonical" href="https://wraithioner.github.io/Game/" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Open Graph / Twitter card: this is what a pasted link looks like in a
       chat app, which matters directly here since the whole retention/growth
       hypothesis (docs/RESEARCH.md §11-14) rides on links to this game being
       shared. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Swerve" />
  <meta property="og:description" content="Dodge, jump, and slide through an endless 3-lane obstacle course — the same daily course every player in the world faces at once." />
  <meta property="og:url" content="https://wraithioner.github.io/Game/" />
  <meta property="og:image" content="https://wraithioner.github.io/Game/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Swerve" />
  <meta name="twitter:description" content="Dodge, jump, and slide through an endless 3-lane obstacle course — the same daily course every player in the world faces at once." />
  <meta name="twitter:image" content="https://wraithioner.github.io/Game/icons/og-image.png" />
</head>
<body>
  <noscript>
    <p style="max-width:420px;margin:3rem auto;padding:0 1.5rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.5;color:#2b2b2e;">
      Swerve needs JavaScript to run — it's a real-time reflex game, and the timing itself is the whole point.
      Please enable JavaScript for this page and reload.
    </p>
  </noscript>
  <div id="app">

    <section id="screen-home" class="screen" data-screen="home">
      <button id="open-settings" class="icon-btn corner-right" aria-label="Settings" type="button">⚙</button>
      <h1 class="wordmark">Swerve</h1>

      <div class="today-card">
        <p class="eyebrow" id="run-number">Run —</p>
        <p class="today-status" id="today-status">One course. Every player. Once a day.</p>
        <button id="play-daily" class="btn btn-primary" type="button">Play Today's Run</button>
      </div>

      <button id="play-practice" class="btn btn-secondary" type="button">Practice</button>

      <div class="home-stats">
        <span id="streak-flame" class="stat-pill" hidden>🔥 <span id="streak-count">0</span></span>
        <button id="open-journal" class="stat-pill stat-pill-button" type="button">Journal</button>
      </div>
    </section>

    <section id="screen-run" class="screen" data-screen="run" hidden>
      <div class="hud">
        <span id="hud-distance"></span>
      </div>
      <canvas id="canvas" width="480" height="800" aria-label="Swipe left or right to change lanes, up to jump, down to slide"></canvas>
      <p class="run-hint" id="run-hint" hidden>Swipe to dodge, jump, or slide</p>
    </section>

    <section id="screen-result" class="screen" data-screen="result" hidden>
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
      <p class="tick-strip" id="result-ticks" aria-hidden="true"></p>
      <div class="result-actions">
        <button id="share-btn" class="btn btn-primary" type="button">Share Result</button>
        <button id="result-again" class="btn btn-secondary" type="button">Play Again</button>
        <button id="result-home" class="btn btn-tertiary" type="button">Home</button>
      </div>
      <p class="share-toast" id="share-toast" role="status" hidden></p>
    </section>

    <section id="screen-journal" class="screen" data-screen="journal" hidden>
      <button class="icon-btn corner-left back-home" aria-label="Back to home" type="button">×</button>
      <h2>Journal</h2>
      <dl class="stat-list">
        <div class="stat-row"><dt>Best distance ever</dt><dd id="stat-best">—</dd></div>
        <div class="stat-row"><dt>Recent average</dt><dd id="stat-average">—</dd></div>
        <div class="stat-row"><dt>Recent best</dt><dd id="stat-recent-best">—</dd></div>
        <div class="stat-row"><dt>Obstacles cleared</dt><dd id="stat-cleared">—</dd></div>
        <div class="stat-row"><dt>Runs played</dt><dd id="stat-runs">—</dd></div>
        <div class="stat-row"><dt>Current streak</dt><dd id="stat-streak">—</dd></div>
      </dl>
    </section>

    <section id="screen-settings" class="screen" data-screen="settings" hidden>
      <button class="icon-btn corner-left back-home" aria-label="Back to home" type="button">×</button>
      <h2>Settings</h2>

      <label class="setting-row">
        <span>Sound</span>
        <input type="checkbox" id="setting-sound" />
      </label>
      <label class="setting-row">
        <span>Haptics</span>
        <input type="checkbox" id="setting-haptics" />
      </label>
      <label class="setting-row">
        <span>Reduce motion</span>
        <input type="checkbox" id="setting-motion" />
      </label>
      <fieldset class="theme-fieldset">
        <legend>Theme</legend>
        <label><input type="radio" name="theme" value="auto" /> Auto</label>
        <label><input type="radio" name="theme" value="light" /> Light</label>
        <label><input type="radio" name="theme" value="dark" /> Dark</label>
      </fieldset>
    </section>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
